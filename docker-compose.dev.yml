# WenQu 开发形态(基准 05):只起基础设施,应用与前端本机跑、热重载。
# 卷名带 dev 后缀,与生产卷严格隔离。口令仅限本地开发,生产走 docker-compose.yml + .env 强口令。
services:
  postgres:
    image: pgvector/pgvector:pg16 # 向量 + 全文 + 业务库三合一(ADR-1)
    environment:
      POSTGRES_USER: wenqu
      POSTGRES_PASSWORD: wenqu_dev_only
      POSTGRES_DB: wenqu
    ports:
      - "5432:5432"
    volumes:
      - wenqu_dev_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wenqu -d wenqu"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2024-05-10T01-41-38Z # 固定 tag;升级时按基准改用 digest 钉死
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: wenqu
      MINIO_ROOT_PASSWORD: wenqu_dev_only
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - wenqu_dev_minio:/data

volumes:
  wenqu_dev_pgdata:
  wenqu_dev_minio:
