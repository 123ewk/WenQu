# WenQu 标准形态(生产模板,设计文档 9.1)。
# 注意:M0 阶段为模板预置,server/parser/web 的 Dockerfile 随 M2 交付后此文件才可整体拉起;
#       postgres/minio 部分现在即可用于生产校验(口令 fail-closed)。
# 上线前必须完成设计文档 9.2 的 Go-Live 14 项翻转,并由双人复核。
services:
  web:
    build: ./web # Dockerfile M2 交付:nginx + SPA + 反代 /api,唯一对外入口
    ports:
      - "${WEB_HTTP_PORT:-80}:80"
    depends_on:
      - server

  server:
    build: ./server
    env_file: .env
    expose:
      - "8000" # 不映射宿主端口(翻转项 #9):仅 web 反代可达
    depends_on:
      - postgres
      - minio
      - parser

  parser:
    build: ./parser
    environment:
      PARSER_LISTEN_ADDR: ":50051"
      PARSER_REQUIRE_TOKEN: "1" # 生产强制 Token(翻转项 #6),未配置拒绝启动
      PARSER_GRPC_TOKEN: "${PARSER_GRPC_TOKEN:?请在 .env 设置解析服务 Token}"
    expose:
      - "50051" # 仅内网可达

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: "${POSTGRES_USER:?请在 .env 设置数据库用户}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?请在 .env 设置数据库强口令(翻转项 #2)}"
      POSTGRES_DB: "${POSTGRES_DB:-wenqu}"
    volumes:
      - wenqu_pgdata:/var/lib/postgresql/data # 有状态服务必须挂持久卷(翻转项 #11)
    # 不映射宿主端口

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z # 升级时按基准改用 digest 钉死
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:?请在 .env 设置对象存储用户}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:?请在 .env 设置对象存储强口令(翻转项 #2)}"
    volumes:
      - wenqu_minio:/data

  # 可选服务按需拉起(compose profiles,基准 05):默认服务集最小化
  # redis:      # 触发条件:日任务>1000 或扩多副本(设计文档第 11 节登记项)
  #   image: redis:7-alpine
  #   profiles: [redis]
  #   volumes:
  #     - wenqu_redis:/data
  # gateway:    # LiteLLM 模型网关,上游模型 >=3 家或需统一限流计费时启用(ADR-4)
  #   profiles: [gateway]

volumes:
  wenqu_pgdata:
  wenqu_minio:
  # wenqu_redis:
