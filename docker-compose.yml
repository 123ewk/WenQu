# WenQu 标准形态(生产模板,设计文档 9.1)。
# 五常驻容器(web/server/parser/postgres/minio)+ worker + 一次性 migrate(Go-Live 翻转项 #12:
# 迁移失败 → migrate 容器退出非零 → server 不启动 = 阻断启动)。
# 上线前必须完成设计文档 9.2 的 Go-Live 14 项翻转(逐项证据见 docs/上线手册.md),并双人复核。
# 口令/密钥全部 ${...:?} 显式注入(翻转项 #2/#3/#6 fail-closed,留空即 compose 拒起)。
x-logging: &default-logging
  # 翻转项 #13:落盘+轮转由 docker 日志驱动承担(应用侧只写 stdout,prod 为 JSON 且已脱敏)
  driver: json-file
  options:
    max-size: "${LOG_MAX_SIZE:-10m}"
    max-file: "${LOG_MAX_FILE:-5}"

services:
  web:
    build: ./web # nginx-unprivileged 非 root,:8080 + 反代 /api(同源,后端无需 CORS)
    ports:
      - "${WEB_HTTP_PORT:-80}:8080" # 唯一对外入口(翻转项 #9)
    depends_on:
      - server
    restart: unless-stopped
    logging: *default-logging

  migrate:
    build:
      context: . # server 依赖同仓 wenqu-parser 路径包,上下文为仓库根
      dockerfile: server/Dockerfile
    command: ["uv", "run", "--no-sync", "alembic", "upgrade", "head"]
    env_file: .env
    environment:
      APP_DATABASE_URL: "postgresql+psycopg://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@postgres:5432/${POSTGRES_DB:-wenqu}"
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no" # 一次性任务:exit 0 后 server 才起;非零即阻断(翻转项 #12)
    logging: *default-logging

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    env_file: .env
    environment:
      APP_DATABASE_URL: "postgresql+psycopg://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@postgres:5432/${POSTGRES_DB:-wenqu}"
      MINIO_ENDPOINT: "minio:9000"
      MINIO_ACCESS_KEY: "${MINIO_ROOT_USER:?}"
      MINIO_SECRET_KEY: "${MINIO_ROOT_PASSWORD:?}"
      PARSER_GRPC_ADDR: "parser:50051"
      PARSER_GRPC_TOKEN: "${PARSER_GRPC_TOKEN:?}"
    expose:
      - "8000" # 不映射宿主端口(翻转项 #9):仅 web 反代可达
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
      parser:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging

  worker:
    build:
      context: .
      dockerfile: server/Dockerfile
    command: ["uv", "run", "--no-sync", "python", "-m", "app.worker"]
    env_file: .env
    environment:
      APP_DATABASE_URL: "postgresql+psycopg://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@postgres:5432/${POSTGRES_DB:-wenqu}"
      MINIO_ENDPOINT: "minio:9000"
      MINIO_ACCESS_KEY: "${MINIO_ROOT_USER:?}"
      MINIO_SECRET_KEY: "${MINIO_ROOT_PASSWORD:?}"
      PARSER_GRPC_ADDR: "parser:50051"
      PARSER_GRPC_TOKEN: "${PARSER_GRPC_TOKEN:?}"
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
      parser:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging

  parser:
    build: ./parser
    environment:
      PARSER_LISTEN_ADDR: "0.0.0.0:50051" # gRPC 不接受裸 ":50051"(host must not be empty)
      PARSER_REQUIRE_TOKEN: "1" # 生产强制 Token(翻转项 #6),未配置拒绝启动
      PARSER_GRPC_TOKEN: "${PARSER_GRPC_TOKEN:?请在 .env 设置解析服务 Token}"
    expose:
      - "50051" # 仅内网可达(翻转项 #9)
    healthcheck:
      test: ["CMD", "python", "-c", "import socket;socket.create_connection(('127.0.0.1',50051),3).close()"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    logging: *default-logging

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: "${POSTGRES_USER:?请在 .env 设置数据库用户}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?请在 .env 设置数据库强口令(翻转项 #2)}"
      POSTGRES_DB: "${POSTGRES_DB:-wenqu}"
    volumes:
      - wenqu_pgdata:/var/lib/postgresql/data # 有状态服务必须挂持久卷(翻转项 #11)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:?} -d ${POSTGRES_DB:-wenqu}"]
      interval: 5s
      timeout: 3s
      retries: 10
    # 不映射宿主端口(翻转项 #9)
    restart: unless-stopped
    logging: *default-logging

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z # 升级时按基准改用 digest 钉死
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:?请在 .env 设置对象存储用户}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:?请在 .env 设置对象存储强口令(翻转项 #2)}"
    volumes:
      - wenqu_minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10
    # 不映射宿主端口;控制台仅内网(翻转项 #9)
    restart: unless-stopped
    logging: *default-logging

  # 可选服务按需拉起(compose profiles,基准 05):默认服务集最小化
  # redis:      # 触发条件:日任务>1000 或扩多副本(设计文档第 11 节登记项)
  #   image: redis:7-alpine
  #   profiles: [redis]
  #   volumes:
  #     - wenqu_redis:/data
  # gateway:    # LiteLLM 模型网关,上游模型 >=3 家或需统一限流计费时启用(ADR-4)
  #   profiles: [gateway]

volumes:
  wenqu_pgdata:
  wenqu_minio:
  # wenqu_redis:
