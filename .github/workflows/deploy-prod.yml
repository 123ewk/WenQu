name: deploy-prod

# 发布链:Actions 页点 Run workflow → 填 version + 复述 confirm → 校验 → 三条 CI 门禁 → 生产机 runner 本机构建并部署。
# 人墙为什么是"手动点 + 复述版本号":GitHub Free 的私有仓库不支持 Environment 审批门
# (required reviewers 返回 422 billing plan 不支持),而公开仓库才有该能力 —— 两害相权取手动触发。
# 推 tag 与 merge 到 main 都不触发任何东西;tag 只当版本标记用。
on:
  workflow_dispatch:
    inputs:
      version:
        description: "要发布的 tag,如 v1.2.0(必须已在 main 上)"
        required: true
        type: string
      confirm:
        description: "原样再打一遍 deploy <version> 以确认"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-prod
  cancel-in-progress: false # 部署中途不取消:半发布状态比排队更危险

jobs:
  # 先花 5 秒把关输入,避免打错版本号还白跑五分钟 CI
  preflight:
    name: 发布前校验(不碰生产)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 校验复述文本与 tag 指向
        env:
          VERSION: ${{ inputs.version }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          [ "$CONFIRM" = "deploy $VERSION" ] \
            || { echo "confirm 必须原样填「deploy $VERSION」,实际是「$CONFIRM」"; exit 1; }
          # fetch 拉不存在的 refspec 时退出码仍为 0,故先精确查远端有没有这个 tag
          git ls-remote --tags origin | cut -f2 | grep -qxF "refs/tags/$VERSION" \
            || { echo "origin 上没有 tag $VERSION。先: git tag -a $VERSION -m 'release' && git push origin $VERSION"; exit 1; }
          git fetch --no-tags origin "refs/tags/$VERSION:refs/tags/$VERSION"
          TAG_SHA="$(git rev-parse "refs/tags/$VERSION^{commit}")"
          HEAD_SHA="$(git rev-parse HEAD)"
          # 门禁跑的是 main HEAD,部署的就必须是同一份代码,否则"绿了"与"发出去了"不是一回事
          [ "$TAG_SHA" = "$HEAD_SHA" ] \
            || { echo "tag $VERSION 指向 $TAG_SHA,不是 main HEAD $HEAD_SHA,拒绝发布"; exit 1; }

  gate-server:
    name: 门禁 server
    needs: preflight
    uses: ./.github/workflows/server.yml
  gate-parser:
    name: 门禁 parser
    needs: preflight
    uses: ./.github/workflows/parser.yml
  gate-web:
    name: 门禁 web
    needs: preflight
    uses: ./.github/workflows/web.yml

  deploy:
    name: 发布生产
    needs: [preflight, gate-server, gate-parser, gate-web]
    runs-on: [self-hosted, prod, wenqu-deploy]
    environment:
      name: production # 付费墙挡的是审批规则,不是 secrets —— 环境仍负责把 ACR 凭据两项只投喂给本 job
    env:
      ACR_HOST: crpi-vkebrdyzahi82qi0.cn-hangzhou.personal.cr.aliyuncs.com # 个人版实例专属域名;用老的 registry.<地域>.aliyuncs.com 会 401
      ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
      ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
      # 命名空间是明文:Actions 会把日志里任何等于 secret 值的文本换成 ***,而回收清单要打印带命名空间的
      # 完整镜像名供人复制,放进 Secrets 就等于送出一条跑不通的 docker rmi。它不是凭据,知道名字也推不动。
      ACR_NAMESPACE: wen_qu
      WENQU_ENV_FILE: /home/ubuntu/wenqu/.env # 业务密钥只在服务器上,CD 链路不接触
      WENQU_COMPOSE_PROJECT: wenqu # 钉死:卷前缀由它决定,留空则靠探测,而演练项目残留卷会让发布被门 1 拦下
      WENQU_STATE_FILE: /home/ubuntu/wenqu/.deploy-state
      BACKUP_DIR: /home/ubuntu/wenqu/backups
      WENQU_MIN_FREE_GB: "4" # 门 0 水位下限(实际阈值 = max(此值, 上次备份大小×2));盘满会让备份写成残缺件
      WENQU_WEB_URL: http://127.0.0.1 # runner 与栈同机,门 3 走本机回环查 nginx 入口(变量名须与 deploy.sh 的 WENQU_ 前缀一致,否则覆盖不生效)
    steps:
      # 生产机直连 github.com 的握手快但数据传输被限速且间歇断流,单次 checkout
      # (内含 git 自身 3 次重试,约 6.5 分钟)经常全灭。这里串 4 次尝试 + 递增间歇,
      # 总跨度约 25-30 分钟,跨过坏窗口的概率大幅提升(OPT-48 v2.2 发布实测:好坏窗口分钟级轮换)。
      # 四次全灭才终止,并在日志里给出处置指引;任一次成功则照常继续。
      - name: Checkout(尝试 1/4)
        id: co1
        uses: actions/checkout@v4
        continue-on-error: true
      - name: 失败,歇 30s 再试
        if: steps.co1.outcome == 'failure'
        run: sleep 30
      - name: Checkout(尝试 2/4)
        id: co2
        if: steps.co1.outcome == 'failure'
        uses: actions/checkout@v4
        continue-on-error: true
      - name: 失败,歇 60s 再试
        if: steps.co2.outcome == 'failure'
        run: sleep 60
      - name: Checkout(尝试 3/4)
        id: co3
        if: steps.co2.outcome == 'failure'
        uses: actions/checkout@v4
        continue-on-error: true
      - name: 失败,歇 120s 再试
        if: steps.co3.outcome == 'failure'
        run: sleep 120
      - name: Checkout(尝试 4/4)
        id: co4
        if: steps.co3.outcome == 'failure'
        uses: actions/checkout@v4
        continue-on-error: true
      - name: 四次尝试全部失败 → 终止
        if: steps.co4.outcome == 'failure'
        run: |
          echo "连续 4 次 checkout 失败:生产机直连 github.com 的数据传输被限速且间歇断流。"
          echo "  1. 稍后在 Actions 页 Re-run failed jobs 即可(好坏窗口分钟级轮换);"
          echo "  2. 治本:为生产机 git 配置代理,或建 Gitee 镜像改从国内拉取。"
          exit 1

      - name: 登录 ACR(归档位;失败不阻断部署)
        continue-on-error: true
        run: printf '%s' "$ACR_PASSWORD" | docker login "$ACR_HOST" -u "$ACR_USERNAME" --password-stdin

      - name: 构建并部署 ${{ inputs.version }}
        run: WENQU_IMAGE_PREFIX="$ACR_HOST/$ACR_NAMESPACE" bash deploy/deploy.sh "${{ inputs.version }}"

      - name: 部署后快照(排障用)
        if: always()
        run: docker compose ls && docker ps --format 'table {{.Names}}\t{{.Image}}\t{{.Status}}'
