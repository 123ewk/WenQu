name: server

on:
  push:
    branches: [main]
    paths: ["server/**", ".github/workflows/server.yml"]
  pull_request:
    paths: ["server/**", ".github/workflows/server.yml"]
  workflow_call: # 供 deploy-prod.yml 复用同一套门禁,避免发布链与 CI 口径漂移

# 云端 runner 直连官方 PyPI(美国机房,快且稳):清华镜像只适合国内开发机,
# 在 CI 上间歇性 403(实测 pymupdf wheel 拉取被拒)。生产机自托管部署不受影响(仍走镜像)。
env:
  UV_DEFAULT_INDEX: "https://pypi.org/simple"

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: wenqu
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: wenqu
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U wenqu -d wenqu"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: 安装依赖(锁安装)
        working-directory: server
        run: uv sync --locked

      - name: 静态检查(ruff + mypy)
        working-directory: server
        run: |
          uv run ruff check .
          uv run mypy src

      - name: 数据库迁移验证
        working-directory: server
        env:
          APP_DATABASE_URL: postgresql+psycopg://wenqu:ci@localhost:5432/wenqu
        run: uv run alembic upgrade head

      - name: 测试(单元 + PG 集成)
        working-directory: server
        env:
          APP_DATABASE_URL: postgresql+psycopg://wenqu:ci@localhost:5432/wenqu
        run: uv run pytest

  # Go-Live 翻转项 #14:依赖漏洞审计(对 uv.lock 全量解析,不受私有路径包影响)
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: pip-audit(uv.lock)
        working-directory: server
        run: |
          # 去掉自引用的 editable 行(-e .):pip-audit 无法对目录做哈希安装
          uv export --locked --quiet | grep -v '^-e ' > /tmp/reqs.txt
          pipx run pip-audit --strict -r /tmp/reqs.txt
