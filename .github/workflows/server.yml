name: server

on:
  push:
    branches: [main]
    paths: ["server/**", ".github/workflows/server.yml"]
  pull_request:
    paths: ["server/**", ".github/workflows/server.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: wenqu
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: wenqu
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U wenqu -d wenqu"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: 安装依赖(锁安装)
        working-directory: server
        run: uv sync --locked

      - name: 静态检查(ruff + mypy)
        working-directory: server
        run: |
          uv run ruff check .
          uv run mypy src

      - name: 数据库迁移验证
        working-directory: server
        env:
          APP_DATABASE_URL: postgresql+psycopg://wenqu:ci@localhost:5432/wenqu
        run: uv run alembic upgrade head

      - name: 测试(单元 + PG 集成)
        working-directory: server
        env:
          APP_DATABASE_URL: postgresql+psycopg://wenqu:ci@localhost:5432/wenqu
        run: uv run pytest
