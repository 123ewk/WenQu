<!DOCTYPE html>
<!--
  WenQu 高保真原型 · 09/09 个人中心
  布局栅格:侧边栏 240 + 顶栏 56 + 居中窄容器 640px,两张卡片(基本信息 / 修改密码)
  设计令牌:主色 #4F6EF2 · 分区 #F7F8FA · 边框 #E5E7EB · 正文 14px/1.6 · 辅助 12px #9CA3AF · 圆角 8px/卡片 12px
  状态/交互:昵称可改、账号只读 · 更换头像按钮 · 保存后行内成功提示(非 toast) · 修改密码表单 + 行内成功提示
-->
<html lang="zh-CN" class="h-full">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>个人中心 · 问渠 WenQu</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
  theme: { extend: {
    colors: {
      primary: { DEFAULT: '#4F6EF2', hover: '#3E5BE0', soft: '#EEF1FE' },
      surface: '#F7F8FA', line: '#E5E7EB',
      ink: { DEFAULT: '#111827', 2: '#374151', 3: '#6B7280', 4: '#9CA3AF' },
      success: '#10B981', warning: '#F59E0B', danger: '#EF4444',
    },
  } },
};
</script>
<style type="text/tailwindcss">
  body { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Segoe UI", Inter, Roboto, sans-serif; }
  *::-webkit-scrollbar { width: 8px; height: 8px; }
  *::-webkit-scrollbar-thumb { background: #D8DCE3; border-radius: 8px; }
  *::-webkit-scrollbar-track { background: transparent; }

  .btn-primary { @apply h-9 px-4 rounded-lg bg-primary hover:bg-primary-hover text-white text-sm font-medium inline-flex items-center justify-center gap-1.5 transition-colors disabled:opacity-50; }
  .btn-secondary { @apply h-9 px-4 rounded-lg border border-line bg-white hover:bg-surface text-ink-2 text-sm inline-flex items-center justify-center gap-1.5 transition-colors disabled:opacity-50; }
  .icon-btn { @apply w-8 h-8 rounded-lg grid place-items-center text-ink-3 hover:text-ink hover:bg-surface transition-colors shrink-0; }
  .input { @apply h-9 w-full rounded-lg border border-line px-3 text-sm text-ink placeholder:text-ink-4 outline-none focus:border-primary focus:ring-2 focus:ring-primary/15 transition bg-white; }
  .card { @apply bg-white border border-line rounded-xl; }
  .pop { @apply bg-white border border-line rounded-xl p-1.5 z-40; }
  .pop-item { @apply w-full flex items-center gap-2 h-8 px-2 rounded-md text-[13px] text-ink-2 hover:bg-surface cursor-pointer; }
  .nav-item { @apply flex items-center gap-2.5 h-9 px-3 rounded-lg text-sm text-ink-2 hover:bg-surface transition-colors; }
  .nav-active { @apply bg-primary-soft text-primary font-medium; }
  .sb-collapsed { width: 64px; }
  .sb-collapsed .sb-hide { display: none; }
  .sb-collapsed .sb-center { justify-content: center; padding-left: 0; padding-right: 0; }
  .sb-collapsed .sb-show { display: block !important; }
  .field-ok { @apply text-[13px] text-success mt-2.5 hidden items-center gap-1; }
</style>
</head>
<body class="h-screen overflow-hidden flex text-ink-2 bg-white">

<!-- ═══════════ 侧边栏 240px ═══════════ -->
<aside id="sidebar" class="w-60 shrink-0 h-full bg-white border-r border-line flex flex-col transition-[width] duration-200 relative z-30">
  <div class="h-14 px-4 flex items-center gap-2 shrink-0">
    <div class="w-7 h-7 rounded-lg bg-primary grid place-items-center text-white text-[13px] font-semibold shrink-0">问</div>
    <div class="sb-hide leading-none min-w-0">
      <div class="text-[15px] font-semibold text-ink">问渠</div>
      <div class="text-[10px] text-ink-4 mt-0.5">WenQu</div>
    </div>
    <button class="icon-btn ml-auto shrink-0" title="折叠侧边栏" onclick="toggleSidebar()">
      <i data-lucide="panel-left-close" class="w-4 h-4 sb-hide"></i>
      <i data-lucide="panel-left-open" class="w-4 h-4 hidden sb-show"></i>
    </button>
  </div>
  <div class="px-3 mt-1 shrink-0">
    <button onclick="togglePop('spacePop')" class="sb-center w-full h-11 px-2.5 rounded-lg border border-line flex items-center gap-2 hover:bg-surface">
      <i data-lucide="building-2" class="w-4 h-4 text-ink-3 shrink-0"></i>
      <span class="sb-hide flex-1 text-left min-w-0 leading-tight">
        <span class="block text-[13px] font-medium text-ink truncate">产品研发部</span>
        <span class="block text-[11px] text-ink-4">Admin</span>
      </span>
      <i data-lucide="chevrons-up-down" class="w-3.5 h-3.5 text-ink-4 shrink-0 sb-hide"></i>
    </button>
    <div id="spacePop" data-pop class="hidden absolute left-3 top-[110px] w-56 pop">
      <div class="px-2 py-1.5 text-[11px] text-ink-4">我的空间</div>
      <a class="pop-item"><i data-lucide="check" class="w-3.5 h-3.5 text-primary shrink-0"></i><span class="flex-1 truncate">产品研发部</span><span class="text-[11px] text-ink-4">Admin</span></a>
      <a class="pop-item"><span class="w-3.5 shrink-0"></span><span class="flex-1 truncate">市场部知识空间</span><span class="text-[11px] text-ink-4">Viewer</span></a>
      <a class="pop-item"><span class="w-3.5 shrink-0"></span><span class="flex-1 truncate">个人空间</span><span class="text-[11px] text-ink-4">Owner</span></a>
      <div class="my-1.5 border-t border-line"></div>
      <a class="pop-item text-primary"><i data-lucide="plus" class="w-3.5 h-3.5 shrink-0"></i>新建空间</a>
    </div>
  </div>
  <nav class="px-3 mt-4 space-y-1 flex-1 overflow-y-auto">
    <a href="02-chat.html" class="nav-item"><i data-lucide="message-square" class="w-4 h-4 shrink-0"></i><span class="sb-hide">对话</span></a>
    <a href="03-kb-list.html" class="nav-item"><i data-lucide="library-big" class="w-4 h-4 shrink-0"></i><span class="sb-hide">知识库</span></a>
    <a href="07-api-keys.html" class="nav-item"><i data-lucide="key-round" class="w-4 h-4 shrink-0"></i><span class="sb-hide">API Key</span></a>
    <a class="nav-item text-ink-4 cursor-default hover:bg-transparent" title="仅系统管理员可见">
      <i data-lucide="scroll-text" class="w-4 h-4 shrink-0"></i><span class="sb-hide flex-1">审计日志</span>
      <i data-lucide="lock" class="w-3 h-3 shrink-0 text-ink-4 sb-hide"></i>
    </a>
  </nav>
  <div class="p-3 border-t border-line shrink-0 relative">
    <button onclick="togglePop('userPop')" class="sb-center w-full flex items-center gap-2.5 p-1.5 rounded-lg hover:bg-surface">
      <span class="w-7 h-7 rounded-full bg-primary-soft text-primary text-xs font-medium grid place-items-center shrink-0">王</span>
      <span class="sb-hide flex-1 text-left min-w-0 leading-tight">
        <span class="block text-[13px] text-ink font-medium truncate">王砚</span>
        <span class="block text-[11px] text-ink-4">产品研发部 · Admin</span>
      </span>
    </button>
    <div id="userPop" data-pop class="hidden absolute left-3 bottom-14 w-44 pop">
      <a href="09-profile.html" class="pop-item bg-primary-soft !text-primary"><i data-lucide="user" class="w-3.5 h-3.5 shrink-0"></i>个人中心</a>
      <a class="pop-item text-danger hover:bg-danger/5"><i data-lucide="log-out" class="w-3.5 h-3.5 shrink-0"></i>退出登录</a>
    </div>
  </div>
</aside>

<!-- ═══════════ 右侧区域 ═══════════ -->
<div class="flex-1 min-w-0 flex flex-col">
  <header class="h-14 shrink-0 border-b border-line bg-white flex items-center px-6 gap-3">
    <h1 class="text-base font-semibold text-ink">个人中心</h1>
    <div class="ml-auto"></div>
  </header>

  <main class="flex-1 overflow-y-auto">
    <div class="max-w-[640px] mx-auto py-8 px-6 space-y-5">

      <!-- 卡片 1:基本信息 -->
      <div class="card p-6">
        <div class="text-sm font-semibold text-ink">基本信息</div>
        <div class="mt-5 space-y-4">
          <div class="flex items-center gap-4">
            <div class="w-16 h-16 rounded-full bg-primary-soft text-primary text-xl font-medium grid place-items-center shrink-0">王</div>
            <div>
              <button class="btn-secondary !h-8 text-[13px]" onclick="toast('演示:选择头像图片')"><i data-lucide="image-plus" class="w-3.5 h-3.5"></i>更换头像</button>
              <div class="text-xs text-ink-4 mt-1.5">支持 JPG / PNG,≤ 2MB</div>
            </div>
          </div>
          <div>
            <label class="block text-[13px] text-ink-2 mb-1.5">昵称</label>
            <input class="input" value="王砚">
          </div>
          <div>
            <label class="block text-[13px] text-ink-2 mb-1.5">账号 <span class="text-ink-4">(只读)</span></label>
            <input class="input !bg-surface text-ink-4 cursor-not-allowed" value="wang.yan@corp.com" readonly>
          </div>
          <div class="flex items-center gap-3">
            <button class="btn-primary" onclick="saveProfile()">保存</button>
            <span id="profileOk" class="field-ok"><i data-lucide="check" class="w-3.5 h-3.5"></i>已保存</span>
          </div>
        </div>
      </div>

      <!-- 卡片 2:修改密码 -->
      <div class="card p-6">
        <div class="text-sm font-semibold text-ink">修改密码</div>
        <div class="mt-5 space-y-4">
          <div>
            <label class="block text-[13px] text-ink-2 mb-1.5">原密码</label>
            <input id="oldPwd" type="password" class="input" placeholder="请输入当前密码">
          </div>
          <div>
            <label class="block text-[13px] text-ink-2 mb-1.5">新密码</label>
            <input id="newPwd" type="password" class="input" placeholder="至少 8 位,建议包含字母与数字">
            <p id="newPwdErr" class="text-xs text-danger mt-1.5 hidden">新密码长度至少 8 位</p>
          </div>
          <div>
            <label class="block text-[13px] text-ink-2 mb-1.5">确认新密码</label>
            <input id="newPwd2" type="password" class="input" placeholder="再次输入新密码">
            <p id="newPwd2Err" class="text-xs text-danger mt-1.5 hidden">两次输入的密码不一致</p>
          </div>
          <div class="flex items-center gap-3">
            <button class="btn-primary" onclick="savePwd()">提交修改</button>
            <span id="pwdOk" class="field-ok"><i data-lucide="check" class="w-3.5 h-3.5"></i>密码已修改,下次登录请使用新密码</span>
          </div>
        </div>
      </div>

      <div class="text-xs text-ink-4 text-center">加入 WenQu 已 557 天 · 上次登录 2025-09-16 10:24 · IP 10.2.8.23</div>
    </div>
  </main>
</div>

<div id="toasts" class="fixed top-4 right-4 z-[70] flex flex-col gap-2 items-end"></div>

<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<script>
  const $ = id => document.getElementById(id);
  function togglePop(id) {
    const el = $(id);
    document.querySelectorAll('[data-pop]').forEach(p => { if (p !== el) p.classList.add('hidden'); });
    el.classList.toggle('hidden');
  }
  document.addEventListener('click', e => {
    document.querySelectorAll('[data-pop]').forEach(p => { if (!p.contains(e.target)) p.classList.add('hidden'); });
  });
  function toggleSidebar() { $('sidebar').classList.toggle('sb-collapsed'); }
  function toast(msg) {
    const t = document.createElement('div');
    t.className = 'flex items-center gap-2 rounded-lg border border-line bg-white px-3.5 py-2.5 text-[13px] text-ink shadow-sm';
    t.innerHTML = '<span class="w-1.5 h-1.5 rounded-full bg-success shrink-0"></span>' + msg;
    $('toasts').appendChild(t);
    setTimeout(() => { t.style.transition = 'opacity .3s'; t.style.opacity = '0'; setTimeout(() => t.remove(), 300); }, 2000);
  }
  function showInline(id, on) { $(id).classList.toggle('hidden', !on); $(id).classList.toggle('flex', on); }
  function saveProfile() {
    if (!$('.input').value.trim()) return;
    showInline('profileOk', true);
    setTimeout(() => showInline('profileOk', false), 3000);
  }
  function savePwd() {
    const okNew = $('newPwd').value.length >= 8;
    const okSame = $('newPwd').value && $('newPwd').value === $('newPwd2').value;
    showInline('newPwdErr', $('newPwd').value && !okNew);
    showInline('newPwd2Err', $('newPwd2').value && !okSame);
    if (okNew && okSame) {
      showInline('pwdOk', true);
      $('oldPwd').value = $('newPwd').value = $('newPwd2').value = '';
      setTimeout(() => showInline('pwdOk', false), 4000);
    }
  }
</script>
<script>lucide.createIcons();</script>
</body>
</html>
