[project]
name = "wenqu-server"
version = "0.1.0"
description = "WenQu 文档知识库 RAG 平台 — 主 API 服务"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "pyyaml>=6.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "sqlalchemy>=2.0",
    "pyjwt>=2.9",
    "bcrypt>=4.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-pyyaml",
    "testcontainers[postgres]>=4.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# FastAPI 依赖注入的标准写法就是函数调用作默认参数(Depends(...))
"src/app/api/**" = ["B008"]
# 迁移文件为声明式建表代码,行宽豁免
"alembic/versions/**" = ["E501"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
check_untyped_defs = true
exclude = ["^alembic/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: 需要真实 Postgres 的集成测试(Docker 不可用时自动跳过)",
]
