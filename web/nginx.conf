# 生产 web 入口:SPA 静态 + /api 反代 server 容器(同源,后端不配 CORS)。
# SSE(问答流式/续流)必须 proxy_buffering off,否则 delta 被 nginx 攒块、流式失效。
# 基于 nginxinc/nginx-unprivileged:非 root 监听 8080(compose 映射 ${WEB_HTTP_PORT}:8080)。
map $http_connection $connection_upgrade {
    default upgrade;
    ""      close;
}

server {
    listen 8080;
    server_name _;

    # server 容器重建后 IP 会变:静态 proxy_pass 只在加载配置时解析一次 → 502。
    # 用 docker 内置 DNS + 变量强制每次请求运行期重解析(valid=10s)。
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend server:8000;

    root /usr/share/nginx/html;
    index index.html;

    # SPA history 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源缓存由 Vite 内容哈希保证,index.html 不缓存
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # API(含 SSE):^~ 防止被静态正则抢匹配
    location ^~ /api/ {
        proxy_pass http://$backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # 可信代理解析(OPT-12):仅这一跳,XFF 是否采信由 server 的 APP_TRUSTED_PROXIES 判定
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Upgrade $http_upgrade;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        chunked_transfer_encoding on;
    }

    # 排障入口(/health 与 /system/info 在 server 是根路径,不经 /api 前缀)
    location = /health {
        proxy_pass http://$backend;
        proxy_set_header Host $host;
    }
    location = /system/info {
        proxy_pass http://$backend;
        proxy_set_header Host $host;
    }
}
