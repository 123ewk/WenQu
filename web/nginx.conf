# 生产 web 入口:SPA 静态 + /api 反代 server 容器(同源,后端不配 CORS)。
# SSE(问答流式/续流)必须 proxy_buffering off,否则 delta 被 nginx 攒块、流式失效。
# 基于 nginxinc/nginx-unprivileged:非 root 监听 8080(compose 映射 ${WEB_HTTP_PORT}:8080)。
map $http_connection $connection_upgrade {
    default upgrade;
    ""      close;
}

server {
    listen 8080;
    server_name _;
    # 302 等 nginx 自产跳转只出相对路径:监听口 8080 是容器内部口,公网只通 80,
    # 默认行为会拼出 http://<host>:8080/… 的绝对地址,浏览器直达不了
    absolute_redirect off;

    # server 容器重建后 IP 会变:静态 proxy_pass 只在加载配置时解析一次 → 502。
    # 用 docker 内置 DNS + 变量强制每次请求运行期重解析(valid=10s)。
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend server:8000;
    set $langfuse langfuse-langfuse-1:3000;

    root /usr/share/nginx/html;
    index index.html;

    # SPA history 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源缓存由 Vite 内容哈希保证,index.html 不缓存
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # API:WenQu 后端固定 /api/v1/*(含 SSE,^~ 防止被静态正则抢匹配,生死线设置随前缀走);
    # 其余 /api/* 归 Langfuse 控制台(/api/auth /api/trpc …),同源共存互不抢道
    location ^~ /api/v1/ {
        proxy_pass http://$backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # 可信代理解析(OPT-12):仅这一跳,XFF 是否采信由 server 的 APP_TRUSTED_PROXIES 判定
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Upgrade $http_upgrade;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        chunked_transfer_encoding on;
    }
    location ^~ /api/ {
        proxy_pass http://$langfuse;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 排障入口(/health 与 /system/info 在 server 是根路径,不经 /api 前缀)
    location = /health {
        proxy_pass http://$backend;
        proxy_set_header Host $host;
    }
    location = /system/info {
        proxy_pass http://$backend;
        proxy_set_header Host $host;
    }

    # ── Langfuse 控制台反代(自托管 v2「传达室」,走已开放的 80,不新开端口)──
    # Next.js 只认根路径:应用内部链接全是根绝对路径(/auth/… /project/… /_next/…),
    # 故按其真实根前缀放行(与 WenQu SPA 路由 /login /chat /kb /traces… 无碰撞)。
    # 「控制台地址」= http://<SERVER_IP>/langfuse:/langfuse/* 剥前缀进入,
    # 无子路径入口 302 到登录页;onboarding/icon.svg 是无子路径的精确页/资源。
    location = /langfuse { return 302 /langfuse/auth/sign-in; }
    location ^~ /langfuse/ {
        rewrite ^/langfuse/(.*)$ /$1 break;
        proxy_pass http://$langfuse;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location ~ ^/(?:_next|auth|project|onboarding|icon\.svg)(?:/|$) {
        proxy_pass http://$langfuse;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
