[project]
name = "wenqu-parser"
version = "0.1.0"
description = "WenQu 文档知识库 RAG 平台 — 独立文档解析服务(gRPC)"
requires-python = ">=3.11"
dependencies = [
    "grpcio>=1.66",
    "openpyxl>=3.1.5",
    "protobuf>=5.27",
    "pymupdf>=1.28.2",
    "python-docx>=1.2.0",
    "python-pptx>=1.0.2",
]

[dependency-groups]
dev = [
    "grpcio-tools>=1.66",
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/parser_service"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["src/parser_service/gen"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
exclude = ["src/parser_service/gen"]

[tool.pytest.ini_options]
testpaths = ["tests"]
